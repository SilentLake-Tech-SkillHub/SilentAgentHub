[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alipay-web-payment-module"
version = "1.0.0"
description = "Framework-neutral Alipay computer website payment integration core"
requires-python = ">=3.10"
dependencies = ["alipay-sdk-python==3.7.1160"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
